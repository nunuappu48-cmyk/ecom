<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2563EB" />

  <!-- SEO & Metadata -->
  <title>EcomCenter | Modern Online Store & Fast Delivery</title>
  <meta name="description"
    content="Shop top-rated products at unbeatable prices on EcomCenter. Enjoy lightning-fast delivery, verified quality, and seamless online shopping." />
  <meta name="keywords"
    content="ecomcenter, online shopping, ecommerce store, trending deals, electronics, fashion, lifestyle, free delivery" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="EcomCenter" />
  <meta property="og:title" content="EcomCenter — Modern Online Shopping Destination" />
  <meta property="og:description"
    content="Shop trending deals, top-quality products, and enjoy fast doorstep delivery on EcomCenter." />
  <meta property="og:image" content="/logo.svg" />

  <!-- Twitter / X Link Preview -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="EcomCenter — Modern Online Shopping Destination" />
  <meta name="twitter:description"
    content="Shop trending deals, top-quality products, and enjoy fast doorstep delivery on EcomCenter." />
  <meta name="twitter:image" content="/logo.svg" />

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    @keyframes ecomLoader {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(25%);
      }
      100% {
        transform: translateX(200%);
      }
    }
    @keyframes pulseScale {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }
  </style>
</head>

<body
  class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-blue-100 selection:text-blue-900 min-h-screen">
  <div id="root">
    <!-- Clean modern initial preloader before React mounts -->
    <div
      style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F8FAFC;font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden;user-select:none;">

      <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;">

        <!-- Brand Icon Badge -->
        <div style="position:relative;width:84px;height:84px;border-radius:24px;background:#FFFFFF;box-shadow:0 12px 32px rgba(37,99,235,0.18);border:1px solid #DBEAFE;display:flex;align-items:center;justify-content:center;margin-bottom:18px;animation:pulseScale 2s infinite ease-in-out;">
          <img src="/logo.svg" alt="EcomCenter Logo" style="width:56px;height:56px;object-fit:contain;" />
        </div>

        <!-- Company Name -->
        <h1 style="font-weight:900;font-size:28px;color:#0F172A;letter-spacing:-0.02em;margin:0 0 6px 0;line-height:1.2;">
          ECOM<span style="color:#2563EB;">CENTER</span>
        </h1>

        <!-- Subtitle -->
        <p style="font-size:11px;font-weight:700;letter-spacing:0.18em;color:#64748B;margin:0;text-transform:uppercase;">
          Your Ultimate Shopping Destination
        </p>

        <!-- Progress bar -->
        <div style="margin-top:28px;width:180px;height:5px;background:#E2E8F0;border-radius:999px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;width:50%;background:linear-gradient(90deg,#3B82F6,#2563EB,#1D4ED8);border-radius:999px;animation:ecomLoader 1.6s infinite ease-in-out;">
          </div>
        </div>

      </div>

    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
