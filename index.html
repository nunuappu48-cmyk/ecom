<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="shortcut icon" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="image_src" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F4B400" />

  <!-- SEO & Metadata -->
  <title>Fellas Honey | 100% Pure & Raw Natural Honey</title>
  <meta name="description"
    content="Pure Honey, Straight From Nature. Naturally delicious honey, carefully sourced, raw, unpasteurized, and delivered straight to your doorstep." />
  <meta name="keywords"
    content="pure honey, raw honey, organic honey, wildflower honey, acacia honey, manuka honey, fellas honey, artisanal honey" />

  <!-- Open Graph / Link Sharing (WhatsApp, Facebook, Telegram, iMessage, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Fellas Honey" />
  <meta property="og:title" content="Fellas Honey — Pure Honey, Straight From Nature" />
  <meta property="og:description"
    content="Naturally delicious honey, carefully sourced and delivered straight to your doorstep. 100% Pure, Raw & Certified." />
  <meta property="og:image" content="/logo.png" />
  <meta property="og:image:secure_url" content="/logo.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:alt" content="Fellas Honey Logo" />

  <!-- Twitter / X Link Preview -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Fellas Honey — Pure Honey, Straight From Nature" />
  <meta name="twitter:description"
    content="Naturally delicious honey, carefully sourced and delivered straight to your doorstep. 100% Pure, Raw & Certified." />
  <meta name="twitter:image" content="/logo.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Preloader Keyframe Animations -->
  <style>
    @keyframes beeFlight {
      0% {
        transform: translate(-38px, -24px) rotate(-10deg) scale(0.96);
      }

      25% {
        transform: translate(32px, -42px) rotate(14deg) scale(1.04);
      }

      50% {
        transform: translate(46px, 16px) rotate(-6deg) scale(1);
      }

      75% {
        transform: translate(-42px, 20px) rotate(-16deg) scale(1.02);
      }

      100% {
        transform: translate(-38px, -24px) rotate(-10deg) scale(0.96);
      }
    }

    @keyframes honeyProgress {
      0% {
        transform: translateX(-100%);
      }

      50% {
        transform: translateX(30%);
      }

      100% {
        transform: translateX(200%);
      }
    }
  </style>
</head>

<body
  class="bg-cream-100 text-amberBrown-900 font-sans antialiased selection:bg-honey-200 selection:text-amberBrown-900 min-h-screen">
  <div id="root">
    <div
      style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%, #FFFDF5 0%, #FFF7D6 30%, #FEE898 60%, #F59E0B 88%, #451A03 100%);font-family:'Playfair Display',Georgia,serif;overflow:hidden;user-select:none;">

      <!-- Hexagon Pattern -->
      <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.2;"
        xmlns="http://www.w3.org/2000/svg">
        <pattern id="init-honeycomb" width="56" height="100" patternUnits="userSpaceOnUse"
          patternTransform="scale(1.2)">
          <path d="M28 66L0 50L0 16L28 0L56 16L56 50L28 66L28 100" fill="none" stroke="#92400E" stroke-width="1.5"
            opacity="0.6" />
          <path d="M28 0L28 33L0 50L0 83L28 100L56 83L56 50L28 33" fill="none" stroke="#92400E" stroke-width="1.5"
            opacity="0.6" />
        </pattern>
        <rect width="100%" height="100%" fill="url(#init-honeycomb)" />
      </svg>

      <!-- Centered Content -->
      <div
        style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px;">

        <!-- Logo & Flying Bee -->
        <div
          style="position:relative;width:160px;height:160px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;">
          <!-- Bee -->
          <div style="position:absolute;z-index:20;pointer-events:none;animation:beeFlight 4.5s ease-in-out infinite;">
            <img src="/3004.gif" alt="Flying Bee"
              style="width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(69,26,3,0.35));" />
          </div>
          <!-- Logo Badge -->
          <div
            style="position:relative;z-index:10;width:104px;height:104px;border-radius:24px;background:rgba(255,255,255,0.95);padding:14px;box-shadow:0 12px 40px rgba(183,121,31,0.35);border:2px solid #FFE580;display:flex;align-items:center;justify-content:center;">
            <img src="/logo.png" alt="Fellas Honey" style="width:100%;height:100%;object-fit:contain;" />
          </div>
        </div>

        <!-- Company Name -->
        <h1
          style="font-weight:900;font-size:32px;color:#3E2723;letter-spacing:0.05em;margin:8px 0 4px 0;line-height:1.1;">
          FELLAS HONEY
        </h1>

        <!-- Subtitle -->
        <div style="display:flex;align-items:center;gap:10px;margin:4px 0;">
          <span style="height:1.5px;width:32px;background:#B7791F;"></span>
          <span style="font-size:14px;">🍯</span>
          <span style="height:1.5px;width:32px;background:#B7791F;"></span>
        </div>

        <p
          style="font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:800;letter-spacing:0.25em;color:#794D3F;margin:4px 0 0 0;text-transform:uppercase;">
          100% Pure Artisanal Honey
        </p>

        <!-- Progress bar -->
        <div
          style="margin-top:28px;width:200px;height:8px;background:rgba(69,26,3,0.15);border-radius:999px;overflow:hidden;padding:2px;border:1px solid rgba(69,26,3,0.2);">
          <div
            style="height:100%;width:50%;background:linear-gradient(90deg,#F59E0B,#FFD54F,#F59E0B);border-radius:999px;animation:honeyProgress 2s infinite ease-in-out;">
          </div>
        </div>

      </div>

    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
